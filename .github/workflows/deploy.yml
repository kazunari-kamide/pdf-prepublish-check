# SPDX-License-Identifier: AGPL-3.0-only
#
# 本番の配信（docs/deploy.md）。main に入ったら、ビルドして Xserver に FTPS で上げ、本番を確かめる。
# ジョブは 2 つに分ける：
#   build  … ビルドとテスト。Environment なし・Secrets なし。依存のインストールのスクリプトは動かさない（--ignore-scripts）。
#            dist/ を成果物にし、ファイルごとの SHA-256 の一覧と、その一覧のハッシュを出す
#   deploy … 配信。Environment「production」の Secrets を使う。成果物を受け取ってハッシュを照らし、lftp と本番の確かめだけをする。
#            npm は動かさない（check:live・check:browser は node で直接動かす。どちらも node: の部品と csp.ts・htaccess.ts しか読まない）
# - 動かすきっかけは main への push と、手で動かす（workflow_dispatch）だけ。pull_request_target は使わない
# - 他人の Action はコミットの SHA で固定する。lftp は Ubuntu の apt から入れる
# - lftp のコマンドを表示しない（set -x を使わない）。パスワードはコマンドの引数に書かず、環境変数で渡す

name: 本番の配信

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 配信は1つずつ。途中で止めると、上げかけのまま残るため、後から来た方を待たせる
concurrency:
  group: production
  cancel-in-progress: false

jobs:
  build:
    name: ビルドとテスト（Secrets なし）
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      list-sha256: ${{ steps.hash.outputs.list-sha256 }}
    steps:
      - name: コードを取り出す
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Node を用意する
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0

      - name: 依存を入れる（package-lock.json のとおり。インストールのスクリプトは動かさない）
        run: npm ci --ignore-scripts

      - name: ビルドする（dist/ の確かめも含む）
        run: npm run build

      - name: テスト
        run: npm test

      - name: 配信するファイルのハッシュ
        id: hash
        run: |
          set -euo pipefail
          cd dist
          find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > ../dist.sha256
          cd ..
          cat dist.sha256
          echo "list-sha256=$(sha256sum dist.sha256 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "ハッシュの一覧の SHA-256：$(sha256sum dist.sha256 | cut -d' ' -f1)"

      - name: dist/ を成果物にする（.htaccess を落とさないよう、. で始まるファイルも含める）
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: |
            dist/
            dist.sha256
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: 配信（production）
    needs: build
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 30
    steps:
      # 本番の確かめのスクリプト（scripts/・csp.ts・htaccess.ts）だけを使う。ビルドはしない
      - name: コードを取り出す（確かめのスクリプトのため）
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Node を用意する（確かめのスクリプトを動かすだけ。npm は動かさない）
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0

      - name: 成果物を受け取る
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: .
          digest-mismatch: error

      - name: ハッシュを照らす（ビルドのジョブが出したものと、1つも違わないこと）
        env:
          WANT: ${{ needs.build.outputs.list-sha256 }}
        run: |
          set -euo pipefail
          got=$(sha256sum dist.sha256 | cut -d' ' -f1)
          echo "ハッシュの一覧の SHA-256：$got（ビルドのジョブ：$WANT）"
          test -n "$WANT" && test "$got" = "$WANT"
          cd dist
          sha256sum --check --strict --quiet ../dist.sha256
          # 一覧にないファイルが混じっていないこと
          test "$(find . -type f | wc -l)" = "$(wc -l < ../dist.sha256)"
          test -f .htaccess

      - name: lftp を入れる
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lftp

      - name: dist/ を上げる（FTPS。public_html の中だけを、dist/ と同じにする）
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          # 先に assets/ を足し（消さない）、あとで index.html・.htaccess を上げて古いものを消す。
          # 上げている途中に、新しい index.html がまだ無い資源を指す時間を作らないため
          test -n "$FTP_HOST" && test -n "$FTP_USER" && test -n "$LFTP_PASSWORD"
          lftp -c "
            set cmd:fail-exit true;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate yes;
            set net:max-retries 3;
            set net:timeout 30;
            open --env-password -u \"$FTP_USER\" \"$FTP_HOST\";
            mirror -R --no-perms --verbose=1 dist/assets/ /assets;
            mirror -R --delete --no-perms --verbose=1 dist/ /;
          "

      - name: 本番のヘッダー・ファイルの種類・中身を確かめる
        run: node scripts/check-live.mjs

      - name: 本番で、外への要求が0件かを確かめる
        run: node scripts/check-browser.mjs --url https://omamoripdf.com/
