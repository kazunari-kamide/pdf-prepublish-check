<!doctype html>
<!-- SPDX-License-Identifier: AGPL-3.0-only -->
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>お守りPDF</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="site-header">
      <h1>お守りPDF</h1>
      <p class="lead">PDF を公開・提出する前に、見た目では分からない情報が残っていないかを確かめます。</p>
      <p class="promise">PDF はこのパソコンのブラウザの中だけで読みます。どこにも送りません。</p>
    </header>

    <main>
      <section aria-labelledby="pick-title" class="pick">
        <h2 id="pick-title">PDF を選ぶ</h2>
        <label id="drop" class="drop" for="file">
          <span>ここに PDF を置くか、クリックして選んでください。</span>
          <input id="file" type="file" accept="application/pdf,.pdf" />
        </label>
      </section>

      <section aria-labelledby="result-title" class="result">
        <h2 id="result-title">結果</h2>
        <p id="status" role="status" aria-live="polite">まだ PDF を選んでいません。</p>
        <dl id="facts" class="facts" hidden></dl>
      </section>
    </main>

    <footer class="site-footer">
      <p>この版でできるのは、PDF として読めるかの確かめまでです。漏れの検査は、これから足します。</p>
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
