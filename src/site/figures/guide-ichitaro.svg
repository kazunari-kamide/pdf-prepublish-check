<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" font-family="'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', Meiryo, sans-serif" role="img">
<title>一太郎の書類を PDF にするまでの 3 つの段</title>
<rect x="1" y="1" width="638" height="358" rx="12" fill="#ffffff" stroke="#d9d4ca" stroke-width="2"/>
<rect x="30" y="70" width="176" height="200" rx="12" fill="#f4f2ee" stroke="#d9d4ca" stroke-width="2"/><circle cx="118" cy="110" r="20" fill="#2b2a28"/><text x="118" y="118" font-size="24" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><text x="118" y="176" font-size="26" fill="#2b2a28" font-weight="700" text-anchor="middle">文書の情報</text><text x="118" y="226" font-size="24" fill="#57534e" font-weight="500" text-anchor="middle">名前を消す</text><line x1="210" y1="170" x2="218.0" y2="170.0" stroke="#8a857c" stroke-width="4" stroke-linecap="round"/><polygon points="230,170 214.0,161.0 214.0,179.0" fill="#8a857c"/><rect x="234" y="70" width="176" height="200" rx="12" fill="#f4f2ee" stroke="#d9d4ca" stroke-width="2"/><circle cx="322" cy="110" r="20" fill="#2b2a28"/><text x="322" y="118" font-size="24" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><text x="322" y="176" font-size="26" fill="#2b2a28" font-weight="700" text-anchor="middle">PDF にする</text><text x="322" y="226" font-size="24" fill="#57534e" font-weight="500" text-anchor="middle">書き出す</text><line x1="414" y1="170" x2="422.0" y2="170.0" stroke="#8a857c" stroke-width="4" stroke-linecap="round"/><polygon points="434,170 418.0,161.0 418.0,179.0" fill="#8a857c"/><rect x="438" y="70" width="176" height="200" rx="12" fill="#e7f0ed" stroke="#2f6f5e" stroke-width="2"/><circle cx="526" cy="110" r="20" fill="#2b2a28"/><text x="526" y="118" font-size="24" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><text x="526" y="176" font-size="26" fill="#2b2a28" font-weight="700" text-anchor="middle">確かめる</text><text x="526" y="226" font-size="24" fill="#57534e" font-weight="500" text-anchor="middle">残りを見る</text>
</svg>
