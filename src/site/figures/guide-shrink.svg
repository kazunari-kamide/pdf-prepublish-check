<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" font-family="'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', Meiryo, sans-serif" role="img">
<title>ファイルを小さくしても、隠れた情報はそのまま残る</title>
<rect x="1" y="1" width="638" height="358" rx="12" fill="#ffffff" stroke="#d9d4ca" stroke-width="2"/>
<path d="M40 60 H186 L210 84 V280 H40 Z" fill="#ffffff" stroke="#2b2a28" stroke-width="3"/><path d="M186 60 V84 H210" fill="none" stroke="#2b2a28" stroke-width="3"/><rect x="50" y="236" width="150" height="32" rx="4" fill="#2b2a28"/><text x="125" y="261" font-size="24" fill="#ffffff" font-weight="700" text-anchor="middle">大きい PDF</text><rect x="60" y="100" width="130" height="30" rx="6" fill="#f7e9e8" stroke="#a3201b" stroke-width="2"/><text x="72" y="124" font-size="24" fill="#a3201b" font-weight="500" text-anchor="start">作成者</text><line x1="226" y1="170" x2="288.0" y2="170.0" stroke="#8a857c" stroke-width="4" stroke-linecap="round"/><polygon points="300,170 284.0,161.0 284.0,179.0" fill="#8a857c"/><text x="263" y="150" font-size="24" fill="#57534e" font-weight="500" text-anchor="middle">小さく</text><path d="M316 100 H442 L466 124 V280 H316 Z" fill="#ffffff" stroke="#2b2a28" stroke-width="3"/><path d="M442 100 V124 H466" fill="none" stroke="#2b2a28" stroke-width="3"/><rect x="326" y="236" width="130" height="32" rx="4" fill="#2b2a28"/><text x="391" y="261" font-size="24" fill="#ffffff" font-weight="700" text-anchor="middle">小さい PDF</text><rect x="330" y="136" width="102" height="30" rx="6" fill="#f7e9e8" stroke="#a3201b" stroke-width="2"/><text x="340" y="160" font-size="24" fill="#a3201b" font-weight="500" text-anchor="start">作成者</text><rect x="486" y="150" width="80" height="44" rx="22" fill="#a3201b"/><text x="526" y="179" font-size="26" fill="#ffffff" font-weight="700" text-anchor="middle">残る</text><text x="486" y="250" font-size="26" fill="#2f6f5e" font-weight="700" text-anchor="start">先に消す</text>
