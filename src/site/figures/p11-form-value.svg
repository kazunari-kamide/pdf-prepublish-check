<rect x="40" y="40" width="560" height="280" rx="6" fill="#ffffff" stroke="#8a857c" stroke-width="2"/><text x="70" y="90" font-size="28" fill="#2b2a28" font-weight="700" text-anchor="start">申請書</text><text x="70" y="148" font-size="24" fill="#57534e" font-weight="500" text-anchor="start">名前</text><rect x="170" y="118" width="300" height="44" rx="6" fill="#f7e9e8" stroke="#a3201b" stroke-width="3"/><text x="186" y="150" font-size="26" fill="#a3201b" font-weight="700" text-anchor="start">架空 花子</text><text x="70" y="216" font-size="24" fill="#57534e" font-weight="500" text-anchor="start">番号</text><rect x="170" y="186" width="300" height="44" rx="6" fill="#f7e9e8" stroke="#a3201b" stroke-width="3"/><text x="186" y="218" font-size="26" fill="#a3201b" font-weight="700" text-anchor="start">0000-1234</text><rect x="70" y="252" width="244" height="42" rx="21" fill="#a3201b"/><text x="192" y="279" font-size="24" fill="#ffffff" font-weight="700" text-anchor="middle">前の値が残ったまま</text>
