<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" font-family="'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', Meiryo, sans-serif" role="img">
<title>開いたときやボタンを押したときに、スクリプトが動いて外へつなぐ</title>
<rect width="640" height="360" fill="#ffffff"/>
<rect x="40" y="40" width="240" height="280" rx="6" fill="#ffffff" stroke="#8a857c" stroke-width="2"/><rect x="64" y="76" width="192" height="8" rx="4" fill="#d9d4ca"/><rect x="64" y="98" width="192" height="8" rx="4" fill="#d9d4ca"/><rect x="64" y="120" width="192" height="8" rx="4" fill="#d9d4ca"/><rect x="64" y="142" width="115" height="8" rx="4" fill="#d9d4ca"/><rect x="64" y="200" width="150" height="50" rx="8" fill="#2b2a28"/><text x="139" y="234" font-size="24" fill="#ffffff" font-weight="700" text-anchor="middle">ボタン</text><line x1="296" y1="180" x2="368.0" y2="180.0" stroke="#a3201b" stroke-width="4" stroke-linecap="round"/><polygon points="380,180 364.0,171.0 364.0,189.0" fill="#a3201b"/><rect x="396" y="110" width="210" height="140" rx="10" fill="#f7e9e8" stroke="#a3201b" stroke-width="3"/><text x="416" y="160" font-size="26" fill="#a3201b" font-weight="700" text-anchor="start">スクリプト</text><text x="416" y="204" font-size="24" fill="#2b2a28" font-weight="500" text-anchor="start">外のサイトへ</text><rect x="396" y="276" width="220" height="42" rx="21" fill="#a3201b"/><text x="506" y="303" font-size="24" fill="#ffffff" font-weight="700" text-anchor="middle">開く前に確かめる</text>
