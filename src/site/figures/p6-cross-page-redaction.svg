<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" font-family="'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', Meiryo, sans-serif" role="img">
<title>同じ書式の 2 枚のうち、1 枚目は氏名の欄を塗り、もう 1 枚は同じ欄を塗り忘れている図</title>
<rect width="640" height="360" fill="#ffffff"/>
<rect x="40" y="40" width="240" height="250" rx="6" fill="#ffffff" stroke="#8a857c" stroke-width="2"/><rect x="64" y="70" width="114" height="8" rx="4" fill="#d9d4ca"/><rect x="60" y="108" width="200" height="30" rx="0" fill="#2b2a28"/><rect x="64" y="168" width="190" height="8" rx="4" fill="#d9d4ca"/><rect x="64" y="190" width="190" height="8" rx="4" fill="#d9d4ca"/><rect x="64" y="212" width="190" height="8" rx="4" fill="#d9d4ca"/><rect x="64" y="234" width="114" height="8" rx="4" fill="#d9d4ca"/><text x="160" y="330" font-size="26" fill="#2b2a28" font-weight="500" text-anchor="middle">1 枚目</text><rect x="360" y="40" width="240" height="250" rx="6" fill="#ffffff" stroke="#a3201b" stroke-width="2"/><rect x="384" y="70" width="114" height="8" rx="4" fill="#d9d4ca"/><rect x="380" y="108" width="200" height="30" rx="0" fill="#f7e9e8" stroke="#a3201b" stroke-width="3"/><text x="396" y="132" font-size="24" fill="#a3201b" font-weight="700" text-anchor="start">氏名が見える</text><rect x="384" y="168" width="190" height="8" rx="4" fill="#d9d4ca"/><rect x="384" y="190" width="190" height="8" rx="4" fill="#d9d4ca"/><rect x="384" y="212" width="190" height="8" rx="4" fill="#d9d4ca"/><rect x="384" y="234" width="114" height="8" rx="4" fill="#d9d4ca"/><text x="480" y="330" font-size="26" fill="#a3201b" font-weight="700" text-anchor="middle">3 枚目：塗り忘れ</text>
</svg>
