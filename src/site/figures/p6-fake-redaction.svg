<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" font-family="'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', Meiryo, sans-serif" role="img">
<title>黒い四角は上に重なっているだけで、下の字の層が残っている断面の図</title>
<rect width="640" height="360" fill="#ffffff"/>
<text x="40" y="64" font-size="26" fill="#2b2a28" font-weight="700" text-anchor="start">横から見ると</text><rect x="80" y="110" width="300" height="34" rx="0" fill="#2b2a28"/><text x="400" y="136" font-size="26" fill="#2b2a28" font-weight="500" text-anchor="start">黒い四角</text><rect x="80" y="190" width="300" height="34" rx="0" fill="#f7e9e8" stroke="#a3201b" stroke-width="2"/><rect x="96" y="203" width="156" height="8" rx="4" fill="#a3201b"/><text x="400" y="216" font-size="26" fill="#a3201b" font-weight="700" text-anchor="start">下の字</text><rect x="60" y="258" width="340" height="10" rx="0" fill="#8a857c"/><text x="416" y="272" font-size="24" fill="#57534e" font-weight="500" text-anchor="start">ページ</text><rect x="80" y="300" width="244" height="42" rx="21" fill="#a3201b"/><text x="202" y="327" font-size="24" fill="#ffffff" font-weight="700" text-anchor="middle">選んでコピーできる</text>
</svg>
