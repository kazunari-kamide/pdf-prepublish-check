<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" font-family="'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', Meiryo, sans-serif" role="img">
<title>ある段落で黒く塗った地名が、下の段落には塗られずに出ている図</title>
<rect width="640" height="360" fill="#ffffff"/>
<rect x="40" y="40" width="300" height="280" rx="6" fill="#ffffff" stroke="#8a857c" stroke-width="2"/><rect x="64" y="72" width="151" height="8" rx="4" fill="#d9d4ca"/><rect x="64" y="100" width="96" height="28" rx="0" fill="#2b2a28"/><rect x="176" y="108" width="84" height="8" rx="4" fill="#d9d4ca"/><rect x="64" y="150" width="252" height="8" rx="4" fill="#d9d4ca"/><rect x="64" y="172" width="151" height="8" rx="4" fill="#d9d4ca"/><rect x="64" y="220" width="110" height="34" rx="6" fill="#f7e9e8" stroke="#a3201b" stroke-width="3"/><text x="76" y="246" font-size="24" fill="#a3201b" font-weight="700" text-anchor="start">空見台</text><rect x="190" y="232" width="76" height="8" rx="4" fill="#d9d4ca"/><rect x="64" y="280" width="120" height="8" rx="4" fill="#d9d4ca"/><text x="364" y="120" font-size="26" fill="#2b2a28" font-weight="700" text-anchor="start">ここは塗った</text><line x1="356" y1="230" x2="311.9" y2="236.3" stroke="#a3201b" stroke-width="4" stroke-linecap="round"/><polygon points="300,238 317.1,244.6 314.6,226.8" fill="#a3201b"/><text x="364" y="222" font-size="26" fill="#a3201b" font-weight="700" text-anchor="start">同じ字が</text><text x="364" y="260" font-size="26" fill="#a3201b" font-weight="700" text-anchor="start">ほかの所に出る</text>
</svg>
