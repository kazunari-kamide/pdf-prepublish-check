<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" font-family="'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', Meiryo, sans-serif" role="img">
<title>墨消しの印を付けただけで適用していないと、下の字が残る</title>
<rect width="640" height="360" fill="#ffffff"/>
<rect x="40" y="40" width="230" height="280" rx="6" fill="#ffffff" stroke="#8a857c" stroke-width="2"/><rect x="64" y="76" width="182" height="8" rx="4" fill="#d9d4ca"/><rect x="64" y="98" width="109" height="8" rx="4" fill="#d9d4ca"/><rect x="60" y="120" width="190" height="44" rx="0" fill="none" stroke="#a3201b" stroke-width="4" stroke-dasharray="8 6"/><rect x="74" y="134" width="97" height="8" rx="4" fill="#2b2a28"/><rect x="64" y="200" width="182" height="8" rx="4" fill="#d9d4ca"/><rect x="64" y="222" width="182" height="8" rx="4" fill="#d9d4ca"/><rect x="64" y="244" width="182" height="8" rx="4" fill="#d9d4ca"/><rect x="64" y="266" width="109" height="8" rx="4" fill="#d9d4ca"/><text x="300" y="110" font-size="26" fill="#2b2a28" font-weight="700" text-anchor="start">印を付けただけ</text><path d="M300 140 l26 26 M326 140 l-26 26" stroke="#a3201b" stroke-width="7" stroke-linecap="round"/><text x="340" y="162" font-size="24" fill="#a3201b" font-weight="500" text-anchor="start">まだ消えていない</text><path d="M300 222 l12 12 l24 -26" fill="none" stroke="#2f6f5e" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="344" y="236" font-size="24" fill="#2f6f5e" font-weight="700" text-anchor="start">「適用」で消える</text>
</svg>
