<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" font-family="'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', Meiryo, sans-serif" role="img">
<title>切り抜いた写真の外側も、ファイルの中に残っている</title>
<rect width="640" height="360" fill="#ffffff"/>
<rect x="60" y="60" width="360" height="240" rx="0" fill="#f7e9e8" stroke="#a3201b" stroke-width="3" stroke-dasharray="8 6"/><text x="76" y="96" font-size="24" fill="#a3201b" font-weight="700" text-anchor="start">元の写真ぜんぶ</text><rect x="150" y="120" width="180" height="130" rx="0" fill="#e7f0ed" stroke="#8a857c" stroke-width="2"/><circle cx="285" cy="159" r="13" fill="#b5afa4"/><polygon points="150,250 213,172 258,217.5 285,191.5 330,250" fill="#2f6f5e"/><rect x="150" y="120" width="180" height="130" fill="none" stroke="#2b2a28" stroke-width="5"/><text x="440" y="160" font-size="24" fill="#2b2a28" font-weight="500" text-anchor="start">見えるのは</text><text x="440" y="196" font-size="24" fill="#2b2a28" font-weight="500" text-anchor="start">黒い枠の中だけ</text><rect x="440" y="230" width="148" height="42" rx="21" fill="#a3201b"/><text x="514" y="257" font-size="24" fill="#ffffff" font-weight="700" text-anchor="middle">外側も残る</text>
</svg>
